[project]
name = "remember-hub"
version = "0.1.0"
description = "Typed perception backends for the Remember prototype"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.10,<3", "websockets>=15,<16", "pyyaml>=6,<7", "numpy>=1.26,<2"]

[project.optional-dependencies]
local = ["ultralytics>=8.3,<9", "clip @ git+https://github.com/ultralytics/CLIP.git@a13192f8cb767260d7dfd98c843b0716593169e7", "insightface==0.7.3", "onnxruntime==1.22.0", "faster-whisper>=1.2,<2", "numpy>=1.26,<2"]
sim = ["opencv-python>=4.11,<4.12", "sounddevice>=0.5,<0.6", "pygame>=2.6,<3"]
lab = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
cloud = ["httpx>=0.28,<1"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "ruff>=0.12", "pyright>=1.1.402"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hub/remember_hub"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["hub/tests", "tools/perception_lab/test_backend.py", "benchmarks/kawk/tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["hub/**/*.py", "scripts/**/*.py", "deployments/**/*.py", "benchmarks/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["hub/remember_hub", "benchmarks/kawk"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = "none"
