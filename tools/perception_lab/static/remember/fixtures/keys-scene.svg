<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Illustration: a keyring with three keys and a tag on a wooden desk beside a laptop and a coffee mug">
  <!-- wall + window light -->
  <rect width="1280" height="720" fill="#fbfaf7"/>
  <rect x="0" y="0" width="1280" height="400" fill="#f3efe6"/>
  <g opacity="0.55">
    <polygon points="900,0 1280,0 1280,400 1030,400" fill="#fbf6e6"/>
    <polygon points="1080,0 1200,0 1120,400 990,400" fill="#fdf9ec"/>
  </g>
  <!-- window frame (partial, right) -->
  <g stroke="#d9d2c4" stroke-width="6" fill="none">
    <rect x="980" y="30" width="260" height="300" rx="4"/>
    <line x1="1110" y1="30" x2="1110" y2="330"/>
    <line x1="980" y1="180" x2="1240" y2="180"/>
  </g>
  <rect x="984" y="34" width="252" height="292" fill="#eaf0ec" opacity="0.5"/>
  <!-- plant on the window sill -->
  <g>
    <rect x="1040" y="340" width="70" height="60" rx="8" fill="#c8a679"/>
    <path d="M1075 340 C1050 300 1040 280 1060 250 C1080 275 1082 305 1075 340Z" fill="#1f6f5b"/>
    <path d="M1075 340 C1090 300 1105 280 1125 270 C1120 300 1100 325 1075 340Z" fill="#2c8a72"/>
    <path d="M1075 340 C1060 315 1035 305 1015 300 C1030 325 1050 338 1075 340Z" fill="#1f6f5b"/>
  </g>
  <!-- desk -->
  <rect x="0" y="400" width="1280" height="320" fill="#c9a67a"/>
  <rect x="0" y="400" width="1280" height="14" fill="#b8925f"/>
  <g stroke="#bd9a6c" stroke-width="3" fill="none" opacity="0.7">
    <path d="M0 470 C300 462 700 478 1280 465"/>
    <path d="M0 540 C400 548 800 530 1280 545"/>
    <path d="M0 620 C350 612 750 628 1280 615"/>
    <path d="M0 690 C300 698 900 682 1280 692"/>
  </g>
  <!-- laptop, half open -->
  <g>
    <ellipse cx="380" cy="600" rx="330" ry="30" fill="#1c1b18" opacity="0.08"/>
    <!-- lid (tilted) -->
    <polygon points="140,270 600,270 640,470 100,470" fill="#5b5a56"/>
    <polygon points="160,286 580,286 616,454 124,454" fill="#e8ecf0"/>
    <polygon points="160,286 580,286 616,454 124,454" fill="#cfd8e4" opacity="0.6"/>
    <!-- base -->
    <polygon points="100,470 640,470 700,590 40,590" fill="#8d8b86"/>
    <polygon points="100,470 640,470 700,590 40,590" fill="#a5a39d"/>
    <polygon points="160,490 590,490 630,560 120,560" fill="#8d8b86"/>
    <rect x="300" y="568" width="150" height="10" rx="4" fill="#7d7b76"/>
    <line x1="100" y1="470" x2="640" y2="470" stroke="#1c1b18" stroke-width="2" opacity="0.5"/>
  </g>
  <!-- coffee mug -->
  <g>
    <ellipse cx="1010" cy="620" rx="80" ry="16" fill="#1c1b18" opacity="0.08"/>
    <path d="M940 480 L960 610 Q1010 626 1060 610 L1080 480 Z" fill="#f4f0e6"/>
    <path d="M940 480 L960 610 Q1010 626 1060 610 L1080 480 Z" fill="none" stroke="#1c1b18" stroke-width="2" opacity="0.45"/>
    <ellipse cx="1010" cy="480" rx="70" ry="14" fill="#fbfaf7" stroke="#1c1b18" stroke-width="2" opacity="0.9"/>
    <ellipse cx="1010" cy="482" rx="58" ry="10" fill="#6b4a2e"/>
    <path d="M1080 505 C1130 500 1140 570 1075 580" fill="none" stroke="#f4f0e6" stroke-width="18"/>
    <path d="M1080 505 C1130 500 1140 570 1075 580" fill="none" stroke="#1c1b18" stroke-width="2" opacity="0.4"/>
    <rect x="955" y="530" width="110" height="26" rx="4" fill="#1f6f5b" opacity="0.85"/>
    <!-- steam -->
    <g fill="none" stroke="#cfc7b8" stroke-width="4" stroke-linecap="round" opacity="0.8">
      <path d="M990 450 C980 435 1000 425 990 410"/>
      <path d="M1020 445 C1010 430 1030 420 1020 405"/>
    </g>
  </g>
  <!-- keyring with three keys and a tag -->
  <g transform="translate(830 565) rotate(-8)">
    <ellipse cx="0" cy="40" rx="150" ry="20" fill="#1c1b18" opacity="0.09"/>
    <!-- key 1: long brass -->
    <g transform="rotate(-30)">
      <rect x="0" y="-9" width="120" height="18" rx="6" fill="#c69a4b"/>
      <rect x="90" y="-9" width="12" height="26" fill="#c69a4b"/>
      <rect x="110" y="-9" width="10" height="22" fill="#c69a4b"/>
      <path d="M0 -9 H120 M0 9 H120" stroke="#1c1b18" stroke-width="1.5" opacity="0.3"/>
    </g>
    <!-- key 2: silver, wide head -->
    <g transform="rotate(10)">
      <rect x="0" y="-8" width="104" height="16" rx="5" fill="#b9bcc0"/>
      <rect x="58" y="8" width="8" height="10" fill="#b9bcc0"/>
      <rect x="76" y="8" width="8" height="8" fill="#b9bcc0"/>
      <rect x="94" y="8" width="8" height="12" fill="#b9bcc0"/>
      <path d="M0 -8 H104" stroke="#1c1b18" stroke-width="1.5" opacity="0.3"/>
    </g>
    <!-- key 3: short, dark head down -->
    <g transform="rotate(48)">
      <rect x="0" y="-7" width="100" height="14" rx="5" fill="#8e8f91"/>
      <rect x="60" y="-16" width="8" height="10" fill="#8e8f91"/>
      <rect x="82" y="-18" width="9" height="12" fill="#8e8f91"/>
    </g>
    <!-- key heads -->
    <circle cx="10" cy="-6" r="22" fill="#c69a4b" stroke="#1c1b18" stroke-width="2"/>
    <circle cx="10" cy="-6" r="7" fill="#c9a67a"/>
    <circle cx="4" cy="6" r="20" fill="#b9bcc0" stroke="#1c1b18" stroke-width="2"/>
    <circle cx="4" cy="6" r="6" fill="#c9a67a"/>
    <rect x="-22" y="6" width="34" height="34" rx="9" fill="#8e8f91" stroke="#1c1b18" stroke-width="2"/>
    <circle cx="-5" cy="23" r="6" fill="#c9a67a"/>
    <!-- ring -->
    <circle cx="-24" cy="-16" r="26" fill="none" stroke="#9a9ca0" stroke-width="7"/>
    <circle cx="-24" cy="-16" r="26" fill="none" stroke="#1c1b18" stroke-width="1.5" opacity="0.4"/>
    <!-- tag on a short loop -->
    <path d="M-44 -30 C-70 -55 -95 -70 -120 -75" fill="none" stroke="#7a766e" stroke-width="3"/>
    <g transform="translate(-175 -105) rotate(-14)">
      <rect x="0" y="0" width="70" height="44" rx="8" fill="#1f6f5b"/>
      <circle cx="58" cy="22" r="5" fill="#fbfaf7"/>
      <rect x="10" y="14" width="34" height="5" rx="2" fill="#fbfaf7" opacity="0.9"/>
      <rect x="10" y="25" width="24" height="5" rx="2" fill="#fbfaf7" opacity="0.7"/>
    </g>
  </g>
  <!-- label -->
  <text x="1256" y="700" text-anchor="end" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="20" fill="#7a766e">Demo illustration</text>
</svg>
