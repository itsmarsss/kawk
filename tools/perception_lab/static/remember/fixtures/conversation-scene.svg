<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Illustration: two people in casual conversation at a hackathon table, one gesturing, with a whiteboard and a plant">
  <!-- room -->
  <rect width="1280" height="720" fill="#fbfaf7"/>
  <rect x="0" y="0" width="1280" height="470" fill="#f3efe6"/>
  <g opacity="0.5">
    <polygon points="0,0 260,0 140,470 0,470" fill="#fdf9ec"/>
  </g>
  <rect x="0" y="470" width="1280" height="250" fill="#e6dfd2"/>
  <line x1="0" y1="470" x2="1280" y2="470" stroke="#d3cbbb" stroke-width="3"/>
  <!-- whiteboard -->
  <g>
    <rect x="720" y="90" width="440" height="260" rx="8" fill="#ffffff" stroke="#d9d2c4" stroke-width="8"/>
    <g stroke-linecap="round" fill="none">
      <path d="M770 150 L900 150" stroke="#1f6f5b" stroke-width="6"/>
      <path d="M770 190 L1040 190 M770 225 L980 225" stroke="#cfc7b8" stroke-width="6"/>
      <rect x="930" y="130" width="90" height="60" rx="6" stroke="#1c1b18" stroke-width="4"/>
      <path d="M1020 160 L1090 160 L1090 250 L1000 250" stroke="#1c1b18" stroke-width="4"/>
      <circle cx="1000" cy="250" r="10" stroke="#1f6f5b" stroke-width="5"/>
      <path d="M790 270 C830 240 860 300 900 270 S960 240 1010 290" stroke="#c69a4b" stroke-width="6"/>
    </g>
    <rect x="740" y="350" width="400" height="12" rx="4" fill="#d9d2c4"/>
    <line x1="820" y1="362" x2="800" y2="470" stroke="#b9bcc0" stroke-width="8"/>
    <line x1="1060" y1="362" x2="1080" y2="470" stroke="#b9bcc0" stroke-width="8"/>
  </g>
  <!-- plant, left -->
  <g>
    <rect x="70" y="400" width="90" height="90" rx="10" fill="#c8a679"/>
    <rect x="70" y="400" width="90" height="14" rx="4" fill="#b8925f"/>
    <path d="M115 400 C80 350 60 320 90 270 C125 300 130 350 115 400Z" fill="#1f6f5b"/>
    <path d="M115 400 C140 340 170 320 200 300 C195 350 160 385 115 400Z" fill="#2c8a72"/>
    <path d="M115 400 C90 370 55 360 30 345 C45 380 80 400 115 400Z" fill="#1f6f5b"/>
    <path d="M115 400 C118 340 135 300 160 260 C165 320 145 370 115 400Z" fill="#2c8a72"/>
  </g>
  <!-- table -->
  <g>
    <ellipse cx="640" cy="640" rx="330" ry="22" fill="#1c1b18" opacity="0.08"/>
    <rect x="330" y="430" width="620" height="24" rx="6" fill="#c9a67a"/>
    <rect x="330" y="430" width="620" height="8" rx="4" fill="#dcbf94"/>
    <rect x="360" y="454" width="16" height="170" fill="#b8925f"/>
    <rect x="904" y="454" width="16" height="170" fill="#b8925f"/>
    <!-- laptop and mug on the table -->
    <polygon points="560,370 700,370 706,430 554,430" fill="#8d8b86"/>
    <polygon points="572,378 688,378 692,422 568,422" fill="#cfd8e4"/>
    <rect x="500" y="396" width="40" height="34" rx="5" fill="#f4f0e6" stroke="#1c1b18" stroke-width="2" opacity="0.9"/>
    <path d="M540 404 C556 402 558 424 540 424" fill="none" stroke="#1c1b18" stroke-width="2" opacity="0.6"/>
    <rect x="800" y="416" width="60" height="14" rx="3" fill="#1f6f5b" opacity="0.8"/>
  </g>
  <!-- chairs -->
  <g fill="#5b5a56">
    <rect x="240" y="470" width="90" height="14" rx="4"/>
    <rect x="248" y="484" width="10" height="120"/>
    <rect x="312" y="484" width="10" height="120"/>
    <rect x="252" y="380" width="14" height="90"/>
    <rect x="252" y="380" width="74" height="12" rx="4"/>
  </g>
  <g fill="#5b5a56">
    <rect x="960" y="470" width="90" height="14" rx="4"/>
    <rect x="968" y="484" width="10" height="120"/>
    <rect x="1032" y="484" width="10" height="120"/>
    <rect x="1024" y="380" width="14" height="90"/>
    <rect x="964" y="380" width="74" height="12" rx="4"/>
  </g>
  <!-- person A (left, gesturing) -->
  <g transform="translate(470 0)">
    <ellipse cx="0" cy="690" rx="70" ry="12" fill="#1c1b18" opacity="0.08"/>
    <!-- legs -->
    <rect x="-38" y="520" width="32" height="170" rx="12" fill="#3d4a5c"/>
    <rect x="6" y="520" width="32" height="170" rx="12" fill="#3d4a5c"/>
    <!-- torso -->
    <path d="M-52 330 L52 330 L60 540 L-60 540 Z" fill="#1f6f5b"/>
    <!-- resting arm -->
    <path d="M-50 345 C-80 400 -85 450 -70 500" fill="none" stroke="#1f6f5b" stroke-width="26" stroke-linecap="round"/>
    <circle cx="-70" cy="506" r="14" fill="#d9a37a"/>
    <!-- gesturing arm -->
    <path d="M50 345 C80 360 110 340 140 300" fill="none" stroke="#1f6f5b" stroke-width="26" stroke-linecap="round"/>
    <circle cx="146" cy="290" r="15" fill="#d9a37a"/>
    <!-- neck + head -->
    <rect x="-14" y="300" width="28" height="40" fill="#d9a37a"/>
    <circle cx="0" cy="270" r="46" fill="#d9a37a"/>
    <path d="M-46 262 A46 46 0 0 1 46 262 Q24 248 0 252 Q-24 248 -46 262Z" fill="#3b2a20"/>
    <circle cx="-14" cy="272" r="3" fill="#1c1b18"/>
    <circle cx="14" cy="272" r="3" fill="#1c1b18"/>
    <path d="M-10 292 Q0 298 10 292" fill="none" stroke="#1c1b18" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- person B (right, listening) -->
  <g transform="translate(810 0)">
    <ellipse cx="0" cy="690" rx="70" ry="12" fill="#1c1b18" opacity="0.08"/>
    <rect x="-38" y="520" width="32" height="170" rx="12" fill="#6b5b4a"/>
    <rect x="6" y="520" width="32" height="170" rx="12" fill="#6b5b4a"/>
    <path d="M-52 330 L52 330 L60 540 L-60 540 Z" fill="#d97a5a"/>
    <!-- arms folded-ish -->
    <path d="M-50 345 C-70 400 -60 440 -20 448" fill="none" stroke="#d97a5a" stroke-width="26" stroke-linecap="round"/>
    <path d="M50 345 C70 400 55 440 15 448" fill="none" stroke="#d97a5a" stroke-width="26" stroke-linecap="round"/>
    <circle cx="-16" cy="450" r="14" fill="#8a5a3c"/>
    <circle cx="14" cy="452" r="14" fill="#8a5a3c"/>
    <rect x="-14" y="300" width="28" height="40" fill="#8a5a3c"/>
    <circle cx="0" cy="270" r="46" fill="#8a5a3c"/>
    <path d="M-48 266 A48 48 0 0 1 48 266 Q30 246 0 250 Q-30 246 -48 266Z" fill="#1c1b18"/>
    <path d="M-50 270 C-58 300 -52 320 -44 330 M50 270 C58 300 52 320 44 330" fill="none" stroke="#1c1b18" stroke-width="10" stroke-linecap="round"/>
    <circle cx="-14" cy="272" r="3" fill="#1c1b18"/>
    <circle cx="14" cy="272" r="3" fill="#1c1b18"/>
    <path d="M-10 292 Q0 298 10 292" fill="none" stroke="#1c1b18" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- small speech mark near the gesturing person -->
  <g fill="none" stroke="#7a766e" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <path d="M640 250 C650 244 656 236 658 226"/>
    <path d="M655 268 C668 262 676 252 680 240"/>
  </g>
  <!-- label -->
  <text x="1256" y="700" text-anchor="end" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="20" fill="#7a766e">Demo illustration</text>
</svg>
